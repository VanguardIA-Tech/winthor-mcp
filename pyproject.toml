[project]
name = "winthor-mcp"
version = "0.1.0"
description = "MCP server para o ERP TOTVS WinThor: catálogo de rotinas, permissões do próprio usuário e execução nativa via WinThor Anywhere."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "VanguardIA" }]
keywords = ["mcp", "winthor", "totvs", "erp", "oracle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=2.11",
  "oracledb>=3.4",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "bcrypt>=4.2",
]

[project.urls]
Homepage = "https://github.com/VanguardIA-Tech/winthor-mcp"
Issues = "https://github.com/VanguardIA-Tech/winthor-mcp/issues"

[project.scripts]
winthor-mcp = "winthor_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "respx>=0.22", "asgi-lifespan>=2.1", "ruff>=0.12", "mypy>=1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winthor_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
